# Stack de dev — Docker-first (alvo canônico de execução).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orquestrador
      POSTGRES_USER: orquestrador
      POSTGRES_PASSWORD: orquestrador
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquestrador"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/orquestrador
      SPRING_DATASOURCE_USERNAME: orquestrador
      SPRING_DATASOURCE_PASSWORD: orquestrador
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
