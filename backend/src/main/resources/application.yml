spring:
  application:
    name: agente-orquestrator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orquestrador}
    username: ${SPRING_DATASOURCE_USERNAME:orquestrador}
    password: ${SPRING_DATASOURCE_PASSWORD:orquestrador}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# ADR-0030 — loop de handoff de contexto do CEO: ao cruzar este % da janela do engine_catalog
# (medido pós-run pelos CostEvents), o turno destila um bilhete e uma continuação FRESCA retoma,
# em vez de --resume bruto (a regra de ouro da ADR-0015, agora automatizada).
orquestrador:
  handoff:
    context-threshold-percent: 55

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
