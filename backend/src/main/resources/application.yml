spring:
  application:
    name: agente-orquestrator
  task:
    scheduling:
      # ADR-0050 — EXPLÍCITO de propósito, e mantido em 1. O defeito que esta fatia veio consertar
      # não era o valor: era ele valer por OMISSÃO (o default do Boot é 1, e ninguém sabia que os 6
      # @Scheduled dividiam `scheduling-1`). Subir para N seria falso conserto — só adiaria a
      # exaustão. O que tira o motor de risco é (a) todo exec() ter prazo e (b) o run do agente sair
      # desta pool pelo DispatchWorker; com os dois, a ocupação máxima desta thread por tarefa
      # passou a ser limitada. Revisitar só quando houver MEDIÇÃO de starvation (o candidato é o
      # lease-reaper de 5s atrás de uma varredura de workspace longa) — e antes disso é preciso
      # verificar que os 5 @Scheduled restantes são seguros de rodar concorrentemente entre si,
      # coisa que hoje nunca aconteceu.
      pool:
        size: 1
  autoconfigure:
    exclude:
      # F-SAI1 não usa continuidade nem tools do Spring AI. A continuidade segue nos adapters
      # Claude/Codex e no Decision-log/MCP existentes.
      - org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orquestrador}
    username: ${SPRING_DATASOURCE_USERNAME:orquestrador}
    password: ${SPRING_DATASOURCE_PASSWORD:orquestrador}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  ai:
    chat:
      client:
        enabled: false
      observations:
        include-error-logging: false
        log-prompt: false
        log-completion: false
    ollama:
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${ORQ_CONTEXT_OLLAMA_MODEL:qwen3:0.6b}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# ADR-0030 — loop de handoff de contexto do CEO: ao cruzar este % da janela do engine_catalog
# (medido pós-run pelos CostEvents), o turno destila um bilhete e uma continuação FRESCA retoma,
# em vez de --resume bruto (a regra de ouro da ADR-0015, agora automatizada).
orquestrador:
  # ADR-0050 — PRAZO de todo subprocesso do motor, por natureza de chamada. O racional de cada
  # default está no javadoc de PrazosDeExecucao (é lá que ele fica junto do código que o usa).
  # Resumo: 30s = plano de controle do daemon · 5min = operação de workspace (sobe container +
  # move tar) · 30s = screenshot (o único prazo que já existia, agora valendo para o gêmeo Docker
  # também) · 2h = teto DURO do run do agente, generoso de propósito (falso positivo aqui mata
  # trabalho bom, que é pior que a falha original).
  execution:
    timeout:
      comando-curto: 30s
      workspace: 5m
      screenshot: 30s
      run: 2h
  handoff:
    context-threshold-percent: 55
  context:
    intelligence:
      mode: "off"
      timeout: 5s
      max-input-bytes: 65536
      prompt-version: context-lint-v1
      provider: ollama
      model: qwen3:0.6b
      worker-threads: 1
      queue-capacity: 32
  # ADR-0044 — validador auxiliar de planos (Uso B / B-ii). Nasce DESLIGADO; `shadow` só registra
  # a telemetria, `push` também empurra o checklist ao arquiteto no run seguinte da mesma issue.
  # `mode` é o kill-switch GLOBAL (push→shadow desliga o empurrão sem parar a régua de precisão);
  # `push-disabled-roles` é o kill-switch POR-PAPEL. Os valores abaixo saíram de MEDIÇÃO empírica
  # (docs/medicao-validador-qwen.md): o qwen3:0.6b do inspetor de contexto é preditor CONSTANTE e
  # NÃO serve aqui; a config completa abaixo (1.7b + think=true + redação do seed) mediu 26/27
  # (0 falso-positivo). think: direção positiva medida (12→14 na redação concreta); seed+think=false
  # não foi medido — a magnitude do think NÃO foi isolada. num_predict curto faz a resposta vir
  # VAZIA (o raciocínio come o orçamento) — 1500 é folga sem custo de latência.
  plan-validation:
    mode: "off"
    model: qwen3:1.7b
    think: true
    num-predict: 1500
    timeout: 120s
    max-input-chars: 20000
    push-disabled-roles: []

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
