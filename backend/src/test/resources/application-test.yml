# Perfil de teste: sobe o app real sem Postgres/Docker.
# H2 em modo PostgreSQL; schema gerado das entidades (Flyway off no teste).
spring:
  datasource:
    url: jdbc:h2:mem:fase0;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

# Scheduler desligado nos testes: dispatcher/reaper sao drivados manualmente (deterministico).
orquestrador:
  scheduling:
    enabled: false
  workspace:
    root: ${java.io.tmpdir}/orquestrador-test-ws
